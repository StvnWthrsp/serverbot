workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages: [verify, package]

default:
  image: golang:1.27.3-bookworm
  tags: [saas-linux-small-amd64]
  interruptible: true
  timeout: 15 minutes
  cache:
    key:
      prefix: go-linux-amd64
      files: [go.mod]
    paths:
      - .cache/go/
      - .cache/go-build/

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOTOOLCHAIN: local
  CGO_ENABLED: "1"

checks:
  stage: verify
  script:
    - go run ./tools/check
  artifacts:
    when: always
    paths: [coverage.out]
    expire_in: 14 days

vulnerabilities:
  stage: verify
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

opencode-contract:
  stage: verify
  script:
    - go run ./tools/contract

packages:
  stage: package
  needs: [checks, vulnerabilities, opencode-contract]
  script:
    - go run ./tools/release -version "${CI_COMMIT_TAG:-dev}"
    - cd dist && sha256sum --check SHA256SUMS
  artifacts:
    name: "minecraft-server-agent-$CI_COMMIT_SHORT_SHA"
    paths: [dist/]
    expire_in: 14 days
